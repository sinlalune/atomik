<svg width="800" height="1300" viewBox="0 0 800 1300" xmlns="http://www.w3.org/2000/svg" role="img"><title>The Cairn protocol — full workflow</title><desc>Role swimlanes: the owner runs the ceremonies and reports friction; the path author registers the accepted declaration on the trunk, then executes one step at a time in an isolated worktree; every completed step is committed, pushed and offered as a fresh-session boundary; an open pull request runs product and protocol gates; each path merges itself. Feedback preempts the roadmap and no integrator exists.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.th{font-size:13.5px;font-weight:600}.ts{font-size:11.5px}.tm{font-size:10.5px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}.hd{font-size:11px;font-weight:600;letter-spacing:0.08em}</style></defs><rect x="0" y="0" width="800" height="1300" fill="#FFFFFF"/><rect x="20" y="26" width="244" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="hd" x="142.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#633806">OWNER / PO</text><line x1="272.0" y1="60" x2="272.0" y2="1270" stroke="#E8E7E2" stroke-width="1"/><rect x="280" y="26" width="244" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="hd" x="402.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#3C3489">PATH (DEV OR AGENT)</text><line x1="532.0" y1="60" x2="532.0" y2="1270" stroke="#E8E7E2" stroke-width="1"/><rect x="540" y="26" width="244" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="hd" x="662.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#444441">CI — AUTOMATED</text><line x1="792.0" y1="60" x2="792.0" y2="1270" stroke="#E8E7E2" stroke-width="1"/><line x1="272.0" y1="128" x2="272.0" y2="156" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="306" x2="402.0" y2="324" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="394" x2="402.0" y2="412" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="466" x2="402.0" y2="484" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="554" x2="402.0" y2="572" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="622" x2="402.0" y2="642" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="662.0" y1="764" x2="662.0" y2="782" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="272.0" y1="936" x2="272.0" y2="956" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="272.0" y1="1064" x2="272.0" y2="1094" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M272.0 218 L272.0 228 L402.0 228 L402.0 236" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M402.0 704 L402.0 708 L662.0 708 L662.0 710" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M662.0 852 L662.0 864 L272.0 864 L272.0 874" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M142.0 1148 L142.0 1168" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M784 819 L790 819 L790 521 L524 521" fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#al)"/><text class="tm" x="782" y="620" text-anchor="end" dominant-baseline="central" fill="#854F0B">next step · fresh session offered</text><path d="M20 1195 L10 1195 L10 189 L20 189" fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#al)"/><text class="tm" x="16" y="700" text-anchor="start" dominant-baseline="central" fill="#854F0B">feedback preempts</text><rect x="20" y="78" width="504" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="272.0" y="97.5" text-anchor="middle" dominant-baseline="central" fill="#633806">Repo initialized</text><text class="ts" x="272.0" y="115.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the document kit lands on day one</text><rect x="20" y="160" width="504" height="58" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="272.0" y="176.0" text-anchor="middle" dominant-baseline="central" fill="#633806">Opening check</text><text class="ts" x="272.0" y="194.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">feature by feature, with the owner</text><text class="ts" x="272.0" y="209.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">-> session note; explicit acceptance</text><rect x="280" y="240" width="244" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="260.0" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Register on the trunk</text><text class="ts" x="402.0" y="278.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">accepted path file + generated ACTIVE</text><text class="ts" x="402.0" y="293.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">metadata only · no implementation</text><rect x="280" y="328" width="244" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="348.0" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Path opened</text><text class="ts" x="402.0" y="366.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">numbered = roadmap · labelled = the rest</text><text class="ts" x="402.0" y="381.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">branch path/&lt;id&gt; · base · declared writes</text><rect x="280" y="416" width="244" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="435.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Worktree + ATOMIK_LANE</text><text class="ts" x="402.0" y="453.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one writer per working tree</text><rect x="280" y="488" width="244" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="508.0" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Execute ONE step</text><text class="ts" x="402.0" y="526.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">code · tests · docs · ledger · brief</text><text class="ts" x="402.0" y="541.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one coherent work unit</text><rect x="280" y="576" width="244" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="593.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Gates bare, locally</text><text class="ts" x="402.0" y="611.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">exit code is the verdict</text><rect x="280" y="646" width="244" height="58" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="669.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Commit + push EVERY step</text><text class="ts" x="402.0" y="687.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">online activity · open PR -> CI</text><rect x="540" y="714" width="244" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="662.0" y="733.5" text-anchor="middle" dominant-baseline="central" fill="#444441">Gates job</text><text class="ts" x="662.0" y="751.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">typecheck · tests · build</text><rect x="540" y="786" width="244" height="66" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="662.0" y="806.0" text-anchor="middle" dominant-baseline="central" fill="#444441">cairn-check job</text><text class="ts" x="662.0" y="824.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">8 blocking · 5 advisory</text><text class="ts" x="662.0" y="839.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">registration + rebase + remote</text><rect x="20" y="878" width="504" height="58" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="272.0" y="894.0" text-anchor="middle" dominant-baseline="central" fill="#633806">Closing ceremony</text><text class="ts" x="272.0" y="912.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the owner accepts the work</text><text class="ts" x="272.0" y="927.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">-> session note (checked by CI)</text><rect x="280" y="960" width="504" height="104" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="532.0" y="978" text-anchor="middle" dominant-baseline="central" fill="#3C3489">THE PATH MERGES ITSELF</text><text class="tm" x="298" y="1000" dominant-baseline="central" fill="#534AB7">1 rebase onto the trunk        3 coherence audit, recorded</text><text class="tm" x="298" y="1018" dominant-baseline="central" fill="#534AB7">2 CI green on the REBASED      4 status: done, in the same PR</text><text class="tm" x="298" y="1036" dominant-baseline="central" fill="#534AB7">  result, never a stale branch 5 merge — no gatekeeper</text><rect x="20" y="1098" width="764" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="402.0" y="1117.5" text-anchor="middle" dominant-baseline="central" fill="#633806">Trunk — always shippable</text><text class="ts" x="402.0" y="1135.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the owner dogfoods this state</text><rect x="20" y="1172" width="244" height="46" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="142.0" y="1189.5" text-anchor="middle" dominant-baseline="central" fill="#633806">Friction report</text><text class="ts" x="142.0" y="1207.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">opens a labelled path</text></svg>
