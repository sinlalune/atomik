<svg width="800" height="1180" viewBox="0 0 800 1180" xmlns="http://www.w3.org/2000/svg" role="img"><title>The Cairn protocol — full workflow</title><desc>Role swimlanes: the owner runs the ceremonies and reports friction, the integrator activates paths and owns the single gate, lanes execute one step at a time in their own worktree, and CI runs the gates and the protocol check. Work loops step by step, feedback preempts the roadmap, and a finished path returns to the closing ceremony.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.th{font-size:13.5px;font-weight:600}.ts{font-size:11.5px}.tm{font-size:10.5px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}.hd{font-size:11px;font-weight:600;letter-spacing:0.08em}</style></defs><rect x="0" y="0" width="800" height="1180" fill="#FFFFFF"/><rect x="20" y="26" width="244" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="hd" x="142.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#633806">OWNER / PO</text><line x1="272.0" y1="60" x2="272.0" y2="1150" stroke="#E8E7E2" stroke-width="1"/><rect x="280" y="26" width="244" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="hd" x="402.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#3C3489">PATH (DEV OR AGENT)</text><line x1="532.0" y1="60" x2="532.0" y2="1150" stroke="#E8E7E2" stroke-width="1"/><rect x="540" y="26" width="244" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="hd" x="662.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#444441">CI — AUTOMATED</text><line x1="792.0" y1="60" x2="792.0" y2="1150" stroke="#E8E7E2" stroke-width="1"/><line x1="272.0" y1="128" x2="272.0" y2="156" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="306" x2="402.0" y2="324" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="378" x2="402.0" y2="396" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="466" x2="402.0" y2="484" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="402.0" y1="534" x2="402.0" y2="554" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="662.0" y1="676" x2="662.0" y2="694" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="272.0" y1="848" x2="272.0" y2="868" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="272.0" y1="976" x2="272.0" y2="1006" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M272.0 218 L272.0 228 L402.0 228 L402.0 236" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M402.0 604 L402.0 614 L662.0 614 L662.0 622" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M662.0 764 L662.0 776 L272.0 776 L272.0 786" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M142.0 1060 L142.0 1080" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M524 423 L534 423 L534 511 L524 511" fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#al)"/><text class="tm" x="538" y="467" text-anchor="start" dominant-baseline="central" fill="#854F0B">next step</text><path d="M20 1107 L10 1107 L10 273 L280 273" fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#al)"/><text class="tm" x="16" y="660" text-anchor="start" dominant-baseline="central" fill="#854F0B">feedback preempts</text><rect x="20" y="78" width="504" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="272.0" y="97.5" text-anchor="middle" dominant-baseline="central" fill="#633806">Repo initialized</text><text class="ts" x="272.0" y="115.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the document kit lands on day one</text><rect x="20" y="160" width="504" height="58" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="272.0" y="176.0" text-anchor="middle" dominant-baseline="central" fill="#633806">Opening check</text><text class="ts" x="272.0" y="194.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">feature by feature, with the owner</text><text class="ts" x="272.0" y="209.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">-> session note; explicit acceptance</text><rect x="280" y="240" width="244" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="260.0" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Path opened</text><text class="ts" x="402.0" y="278.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">numbered = roadmap · labelled = the rest</text><text class="ts" x="402.0" y="293.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">branch path/<id> · base · declared writes</text><rect x="280" y="328" width="244" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="347.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Worktree + ATOMIK_LANE</text><text class="ts" x="402.0" y="365.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one writer per working tree</text><rect x="280" y="400" width="244" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="420.0" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Execute ONE step</text><text class="ts" x="402.0" y="438.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">code + tests + area note + ledger</text><text class="ts" x="402.0" y="453.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">in the same work unit</text><rect x="280" y="488" width="244" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="505.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Gates bare, locally</text><text class="ts" x="402.0" y="523.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">exit code is the verdict</text><rect x="280" y="558" width="244" height="46" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="402.0" y="583.0" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Push -> pull request</text><rect x="540" y="626" width="244" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="662.0" y="645.5" text-anchor="middle" dominant-baseline="central" fill="#444441">Gates job</text><text class="ts" x="662.0" y="663.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">typecheck · tests · build</text><rect x="540" y="698" width="244" height="66" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="662.0" y="718.0" text-anchor="middle" dominant-baseline="central" fill="#444441">cairn-check job</text><text class="ts" x="662.0" y="736.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">5 blocking · 4 advisory</text><text class="ts" x="662.0" y="751.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">incl. the REBASE GATE</text><rect x="20" y="790" width="504" height="58" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="272.0" y="806.0" text-anchor="middle" dominant-baseline="central" fill="#633806">Closing ceremony</text><text class="ts" x="272.0" y="824.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the owner accepts the work</text><text class="ts" x="272.0" y="839.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">-> session note (checked by CI)</text><rect x="280" y="872" width="504" height="104" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="532.0" y="890" text-anchor="middle" dominant-baseline="central" fill="#3C3489">THE PATH MERGES ITSELF</text><text class="tm" x="298" y="912" dominant-baseline="central" fill="#534AB7">1 rebase onto the trunk        3 coherence audit, recorded</text><text class="tm" x="298" y="930" dominant-baseline="central" fill="#534AB7">2 CI green on the REBASED      4 status: done, in the same PR</text><text class="tm" x="298" y="948" dominant-baseline="central" fill="#534AB7">  result, never a stale branch 5 merge — no gatekeeper</text><rect x="20" y="1010" width="764" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="402.0" y="1029.5" text-anchor="middle" dominant-baseline="central" fill="#633806">Trunk — always shippable</text><text class="ts" x="402.0" y="1047.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the owner dogfoods this state</text><rect x="20" y="1084" width="244" height="46" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="142.0" y="1101.5" text-anchor="middle" dominant-baseline="central" fill="#633806">Friction report</text><text class="ts" x="142.0" y="1119.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">opens a labelled path</text></svg>
