<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Coding agent bootstrap and fresh-session protocol</title>
  <desc>Every session resolves its trunk-registered path, verifies repository reality against the Work Ledger, executes one step, persists code, tests, docs, ledger and handoff brief, then commits and pushes before offering the next step in a fresh session. After the path finally merges, another checkout verifies the remote merge and clean secondary worktree, removes that worktree without force, and retains its branch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}</style>
  </defs>
  <rect x="0" y="0" width="680" height="780" fill="#FFFFFF"/>

  <rect x="180" y="32" width="320" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central" fill="#444441">Read AGENTS.md</text>
  <text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">the bootloader</text>
  <line x1="340" y1="87" x2="340" y2="105" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="108" width="320" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="125" text-anchor="middle" dominant-baseline="central" fill="#444441">Resolve the path</text>
  <text class="ts" x="340" y="144" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">branch → ACTIVE → path ledger</text>
  <line x1="340" y1="163" x2="340" y2="181" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="184" width="320" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="340" y="201" text-anchor="middle" dominant-baseline="central" fill="#712B13">Verify ledger vs reality</text>
  <text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Git · remote head · tests · blockers</text>
  <line x1="340" y1="239" x2="340" y2="257" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="260" width="320" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="340" y="277" text-anchor="middle" dominant-baseline="central" fill="#085041">Read required docs + handoff brief</text>
  <text class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">then start the recorded next action</text>
  <line x1="340" y1="315" x2="340" y2="333" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="336" width="320" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="353" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Execute one step</text>
  <text class="ts" x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="#534AB7">only one coherent work unit</text>
  <line x1="340" y1="391" x2="340" y2="409" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="412" width="320" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="340" y="429" text-anchor="middle" dominant-baseline="central" fill="#085041">Persist + run gates bare</text>
  <text class="ts" x="340" y="448" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">code · tests · docs · ledger · brief</text>
  <text class="ts" x="340" y="463" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">exit code is the verdict</text>
  <line x1="340" y1="477" x2="340" y2="495" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="180" y="498" width="320" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="515" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Commit + push immediately</text>
  <text class="ts" x="340" y="534" text-anchor="middle" dominant-baseline="central" fill="#534AB7">step completes only when HEAD is online</text>
  <text class="ts" x="340" y="549" text-anchor="middle" dominant-baseline="central" fill="#534AB7">remote recovery point + activity timestamp</text>

  <text class="th" x="340" y="602" text-anchor="middle" fill="#633806">Agent offers: continue here or fresh session?</text>
  <text class="ts" x="340" y="624" text-anchor="middle" fill="#5F5E5A">fresh session restarts at the top; the owner supplies no recap</text>
  <text class="ts" x="340" y="643" text-anchor="middle" fill="#5F5E5A">the coding path remains running</text>

  <line x1="80" y1="668" x2="600" y2="668" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="180" y="690" width="320" height="66" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th" x="340" y="707" text-anchor="middle" dominant-baseline="central" fill="#712B13">After final merge: retire worktree</text>
  <text class="ts" x="340" y="726" text-anchor="middle" dominant-baseline="central" fill="#993C1D">verify remote merge · require clean checkout</text>
  <text class="ts" x="340" y="741" text-anchor="middle" dominant-baseline="central" fill="#993C1D">remove without force · retain branch history</text>
</svg>
