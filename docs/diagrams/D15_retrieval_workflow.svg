<svg width="860" height="1300" viewBox="0 0 860 1300" xmlns="http://www.w3.org/2000/svg" role="img"><title>Retrieval over the graph — question to grounded answer</title><desc>The retrieval pipeline built by CP-MVP-010: a question is reduced to its subject by the vault's own statistics, answered from what the user already has open, then by BM25 over six weighted fields, then by walking the typed edges; the result is a bounded packet that carries what was selected, what was left out and why, and whether the vault covered the question at all; one trace line records the cost without recording the query; the chat sends the entries as numbered reference notes and the answer comes back with citations that can be checked. When coverage is thin, the model answers from general knowledge and the external half — CP-MVP-011 — is what will go and look.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.th{font-size:13.5px;font-weight:600}.ts{font-size:11.5px}.tm{font-size:10.5px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}.hd{font-size:11px;font-weight:600;letter-spacing:0.08em}</style></defs><rect x="0" y="0" width="860" height="1300" fill="#FFFFFF"/><rect x="20" y="26" width="268" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="hd" x="154.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#3C3489">THE QUESTION</text><rect x="306" y="26" width="268" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="hd" x="440.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#444441">THE VAULT'S OWN STATISTICS</text><rect x="592" y="26" width="268" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="hd" x="726.0" y="39" text-anchor="middle" dominant-baseline="central" fill="#633806">WHAT COMES BACK</text><line x1="154.0" y1="128" x2="154.0" y2="154" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="154.0" y1="262" x2="154.0" y2="300" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="154.0" y1="388" x2="154.0" y2="426" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="440.0" y1="128" x2="440.0" y2="154" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="440.0" y1="262" x2="440.0" y2="300" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="440.0" y1="388" x2="440.0" y2="426" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="726.0" y1="128" x2="726.0" y2="154" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="726.0" y1="262" x2="726.0" y2="300" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="726.0" y1="388" x2="726.0" y2="426" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="154.0" y1="578" x2="154.0" y2="592" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="440.0" y1="666" x2="440.0" y2="698" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="440.0" y1="780" x2="440.0" y2="808" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="154.0" y1="916" x2="154.0" y2="934" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="726.0" y1="916" x2="726.0" y2="934" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="726.0" y1="1020" x2="726.0" y2="1058" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="154.0" y1="1020" x2="154.0" y2="1058" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="440.0" y1="1154" x2="440.0" y2="1192" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="20" y="74" width="840" height="54" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="440.0" y="95.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">A question</text><text class="ts" x="440.0" y="113.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">"que peux tu me dire de platon ?"</text><rect x="20" y="158" width="268" height="104" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="154.0" y="176" text-anchor="middle" dominant-baseline="central" fill="#3C3489">rung 0 · DIRECT</text><text class="tm" x="36" y="198" dominant-baseline="central" fill="#534AB7">what you already have open,</text><text class="tm" x="36" y="215" dominant-baseline="central" fill="#534AB7">pinned or selected — free, and</text><text class="tm" x="36" y="232" dominant-baseline="central" fill="#534AB7">certain (33: never a vault-wide</text><text class="tm" x="36" y="249" dominant-baseline="central" fill="#534AB7">search for a selected paragraph)</text><rect x="306" y="158" width="268" height="104" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="440.0" y="176" text-anchor="middle" dominant-baseline="central" fill="#444441">THE SUBJECT</text><text class="tm" x="322" y="198" dominant-baseline="central" fill="#5F5E5A">everywhere = nowhere: >50% of notes</text><text class="tm" x="322" y="215" dominant-baseline="central" fill="#5F5E5A">the subject is what the vault NAMED</text><text class="tm" x="322" y="232" dominant-baseline="central" fill="#5F5E5A">  — a term carrying half a title</text><text class="tm" x="322" y="249" dominant-baseline="central" fill="#5F5E5A">the phrasing around it ranks nothing</text><rect x="592" y="158" width="268" height="104" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="726.0" y="189.5" text-anchor="middle" dominant-baseline="central" fill="#633806">REACH</text><text class="ts" x="726.0" y="207.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">titles   what a note is called</text><text class="ts" x="726.0" y="222.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">linked   + the notes linked to it</text><text class="ts" x="726.0" y="237.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">full     + everything it says</text><rect x="20" y="304" width="268" height="84" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="154.0" y="325.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">rung 1 · LEXICAL</text><text class="ts" x="154.0" y="343.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">BM25F over six weighted fields:</text><text class="ts" x="154.0" y="358.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">title 3 · heading 2 · path 2 ·</text><text class="ts" x="154.0" y="373.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">frontmatter 1.8 · link 1.5 · body 1</text><rect x="306" y="304" width="268" height="84" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="440.0" y="325.5" text-anchor="middle" dominant-baseline="central" fill="#444441">rung 2 · LINK EXPANSION</text><text class="ts" x="440.0" y="343.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">both ways along every typed edge</text><text class="ts" x="440.0" y="358.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">decay 0.4 per hop · untyped 0.8</text><text class="ts" x="440.0" y="373.5" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">a hub's link is worth 5 / degree</text><rect x="592" y="304" width="268" height="84" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="726.0" y="325.5" text-anchor="middle" dominant-baseline="central" fill="#633806">NEVER GROUNDS</text><text class="ts" x="726.0" y="343.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">chats/    dialogue, not knowledge</text><text class="ts" x="726.0" y="358.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">prompts/  instructions to the model</text><text class="ts" x="726.0" y="373.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">they do not vote on the subject</text><rect x="20" y="430" width="840" height="148" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="440.0" y="448" text-anchor="middle" dominant-baseline="central" fill="#3C3489">THE CONTEXT PACKET</text><text class="tm" x="36" y="470" dominant-baseline="central" fill="#534AB7">entries    path · title · STAGE · why · excerpt · tokens</text><text class="tm" x="36" y="487" dominant-baseline="central" fill="#534AB7">omitted    budget · threshold · scope · duplicate · dialogue</text><text class="tm" x="36" y="504" dominant-baseline="central" fill="#534AB7">coverage   covered | thin | empty  +  matchedTerms / missingTerms</text><text class="tm" x="36" y="521" dominant-baseline="central" fill="#534AB7">budget     bounded in estimated tokens, and named estimated</text><text class="tm" x="36" y="538" dominant-baseline="central" fill="#534AB7">one packet — the trace measures it, the chat sends it, the</text><text class="tm" x="36" y="555" dominant-baseline="central" fill="#534AB7">turn keeps it: what was inspected IS what was sent</text><rect x="20" y="596" width="268" height="70" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="154.0" y="610.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">ONE trace line</text><text class="ts" x="154.0" y="628.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">action: retrieve · deterministic</text><text class="ts" x="154.0" y="643.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">stages · candidates · selected ·</text><text class="ts" x="154.0" y="658.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">tokens · wallMs · zero external</text><rect x="306" y="596" width="554" height="70" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/><text class="th" x="583.0" y="618.0" text-anchor="middle" dominant-baseline="central" fill="#444441">The query is NEVER recorded</text><text class="ts" x="583.0" y="636.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">user text is content, like a prompt;</text><text class="ts" x="583.0" y="651.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">a test greps the ledger to keep it so</text><rect x="20" y="702" width="840" height="78" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="440.0" y="720.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">GROUNDED CHAT</text><text class="ts" x="440.0" y="738.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the entries ride the existing chat contract as read-only</text><text class="ts" x="440.0" y="753.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">reference notes, NUMBERED — composed in MAIN, so no</text><text class="ts" x="440.0" y="768.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">prompt file can opt out of being grounded</text><rect x="20" y="812" width="840" height="104" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="440.0" y="830" text-anchor="middle" dominant-baseline="central" fill="#3C3489">THE ANSWER, TRACEABLE</text><text class="tm" x="36" y="852" dominant-baseline="central" fill="#534AB7">[1] markers decorated into citation chips (the markdown is untouched)</text><text class="tm" x="36" y="869" dominant-baseline="central" fill="#534AB7">hovering a citation lights the SENTENCE it covers</text><text class="tm" x="36" y="886" dominant-baseline="central" fill="#534AB7">a tint means verbatim from that note; a chip means attributed to it</text><text class="tm" x="36" y="903" dominant-baseline="central" fill="#534AB7">an invented number stays visible as unresolved</text><rect x="20" y="938" width="554" height="82" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="297.0" y="958.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">COVERAGE = covered</text><text class="ts" x="297.0" y="976.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the vault answered.</text><text class="ts" x="297.0" y="991.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">the reference notes are the material,</text><text class="ts" x="297.0" y="1006.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">and every claim can be traced to one</text><rect x="592" y="938" width="268" height="82" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/><text class="th" x="726.0" y="958.5" text-anchor="middle" dominant-baseline="central" fill="#633806">COVERAGE = thin / empty</text><text class="ts" x="726.0" y="976.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the vault has no material</text><text class="ts" x="726.0" y="991.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">for these words — a fact about</text><text class="ts" x="726.0" y="1006.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the VAULT, never about the world</text><rect x="592" y="1062" width="268" height="92" rx="6" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.6" stroke-dasharray="5 4"/><text class="th" x="726.0" y="1087.5" text-anchor="middle" dominant-baseline="central" fill="#633806">CP-MVP-011 (next path)</text><text class="ts" x="726.0" y="1105.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Wikipedia · Wikidata · Commons</text><text class="ts" x="726.0" y="1120.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Wiktionary · the model tool loop</text><text class="ts" x="726.0" y="1135.5" text-anchor="middle" dominant-baseline="central" fill="#854F0B">transient, saved on gesture</text><rect x="20" y="1062" width="554" height="92" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="297.0" y="1087.5" text-anchor="middle" dominant-baseline="central" fill="#3C3489">The model answers anyway</text><text class="ts" x="297.0" y="1105.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">retrieval is a SERVICE, not a fence: the request names</text><text class="ts" x="297.0" y="1120.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">what the vault lacks and asks for general knowledge</text><text class="ts" x="297.0" y="1135.5" text-anchor="middle" dominant-baseline="central" fill="#534AB7">there — cited to nothing, and said plainly</text><rect x="20" y="1196" width="840" height="66" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/><text class="th" x="440.0" y="1214" text-anchor="middle" dominant-baseline="central" fill="#3C3489">MEASURED, not asserted</text><text class="tm" x="36" y="1236" dominant-baseline="central" fill="#534AB7">recall@5 100% · MRR 0.955 · build 17 ms · p95 1.8 ms  (fixture, 40 files)</text><text class="tm" x="36" y="1253" dominant-baseline="central" fill="#534AB7">115-file corpus: build 166 ms · index 8.4 MiB · p95 0.4 ms   ADR-013 holds</text></svg>
