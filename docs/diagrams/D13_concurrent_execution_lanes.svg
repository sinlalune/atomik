<svg width="760" height="560" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img"><title>Concurrent execution lanes</title><desc>CP-OPS-001: one active integration parent opens N accepted lanes, each in its own worktree with its own ledger and area note; a single integration gate rebases, runs the gates bare and writes the integrator-owned files; master stays the owner's dogfood state, and owner feedback returns as a preempting feedback lane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.th{font-size:14px;font-weight:500}.ts{font-size:12px;font-weight:400}.tt{font-size:10.5px;font-weight:400}</style></defs><rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/>

<rect x="280" y="28" width="200" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="380" y="47" text-anchor="middle" dominant-baseline="central" fill="#444441">Atomik roadmap</text>
<line x1="380" y1="67" x2="380" y2="86" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="180" y="90" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="380" y="110" text-anchor="middle" dominant-baseline="central" fill="#085041">One active INTEGRATION parent</text><text class="ts" x="380" y="129" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">ACTIVE.md — one strategic direction, one integration order</text>

<line x1="380" y1="147" x2="380" y2="166" stroke="#5F5E5A" stroke-width="1.2"/><line x1="136" y1="166" x2="624" y2="166" stroke="#5F5E5A" stroke-width="1.2"/><line x1="136" y1="166" x2="136" y2="182" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="380" y1="166" x2="380" y2="182" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="624" y1="166" x2="624" y2="182" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="24" y="186" width="224" height="134" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="136" y="208" text-anchor="middle" dominant-baseline="central" fill="#633806">Feedback lane</text><text class="ts" x="136" y="228" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the report is the acceptance</text><text class="tt" x="136" y="254" text-anchor="middle" dominant-baseline="central" fill="#854F0B">own worktree + branch</text><text class="tt" x="136" y="272" text-anchor="middle" dominant-baseline="central" fill="#854F0B">own ledger, no global log</text><text class="tt" x="136" y="290" text-anchor="middle" dominant-baseline="central" fill="#854F0B">own module area note</text><text class="tt" x="136" y="308" text-anchor="middle" dominant-baseline="central" fill="#854F0B">ATOMIK_LANE=&lt;slug&gt;</text>

<rect x="268" y="186" width="224" height="134" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="380" y="208" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Delivery lane</text><text class="ts" x="380" y="228" text-anchor="middle" dominant-baseline="central" fill="#534AB7">a slice of the parent milestone</text><text class="tt" x="380" y="254" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own worktree + branch</text><text class="tt" x="380" y="272" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own ledger, no global log</text><text class="tt" x="380" y="290" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own module area note</text><text class="tt" x="380" y="308" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ATOMIK_LANE=&lt;slug&gt;</text>

<rect x="512" y="186" width="224" height="134" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="th" x="624" y="208" text-anchor="middle" dominant-baseline="central" fill="#712B13">New-scope lane</text><text class="ts" x="624" y="228" text-anchor="middle" dominant-baseline="central" fill="#993C1D">own path + own opening check</text><text class="tt" x="624" y="254" text-anchor="middle" dominant-baseline="central" fill="#993C1D">own worktree + branch</text><text class="tt" x="624" y="272" text-anchor="middle" dominant-baseline="central" fill="#993C1D">own ledger, no global log</text><text class="tt" x="624" y="290" text-anchor="middle" dominant-baseline="central" fill="#993C1D">own module area note</text><text class="tt" x="624" y="308" text-anchor="middle" dominant-baseline="central" fill="#993C1D">ATOMIK_LANE=&lt;slug&gt;</text>

<line x1="136" y1="321" x2="136" y2="356" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="380" y1="321" x2="380" y2="356" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="624" y1="321" x2="624" y2="356" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="120" y="360" width="520" height="92" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="380" y="382" text-anchor="middle" dominant-baseline="central" fill="#085041">Single integration gate</text><text class="ts" x="380" y="404" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">actual diff vs declared writes · overlap check · explicit rebase</text><text class="ts" x="380" y="422" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">gates run BARE on the lane, then again on the merged state</text><text class="ts" x="380" y="440" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">only here: ACTIVE.md · register · log.md · root module note</text>

<line x1="380" y1="453" x2="380" y2="482" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="200" y="486" width="360" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="380" y="504" text-anchor="middle" dominant-baseline="central" fill="#444441">master — the owner's dogfood state</text><text class="ts" x="380" y="523" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">lane work is invisible here until the gate passes</text>

<path d="M200 512 H12 V253 H20" fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/><text class="tt" x="26" y="470" text-anchor="start" dominant-baseline="central" fill="#854F0B">owner feedback</text><text class="tt" x="26" y="486" text-anchor="start" dominant-baseline="central" fill="#854F0B">preempts the roadmap</text>
</svg>
