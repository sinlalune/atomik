<svg width="760" height="600" viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Concurrent coding paths with trunk registration</title>
  <desc>After owner acceptance, each path declaration is registered on the trunk before its implementation branch. Registered paths then run in parallel in isolated worktrees and each rebases, passes gates, records its ceremony and audit, and merges itself. ACTIVE is derived from the registered declarations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .th{font-size:14px;font-weight:600}.ts{font-size:12px}.tt{font-size:10.5px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="600" fill="#FFFFFF"/>

  <rect x="180" y="24" width="400" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.6"/>
  <text class="th" x="380" y="44" text-anchor="middle" dominant-baseline="central" fill="#633806">Opening check + explicit owner acceptance</text>
  <text class="ts" x="380" y="63" text-anchor="middle" dominant-baseline="central" fill="#854F0B">the accepted path declaration is now stable</text>
  <line x1="380" y1="79" x2="380" y2="101" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="120" y="105" width="520" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="th" x="380" y="126" text-anchor="middle" dominant-baseline="central" fill="#085041">Registration-only trunk commit</text>
  <text class="ts" x="380" y="147" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">CP-X.md: id · running · branch · pre-registration base</text>
  <text class="ts" x="380" y="166" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">regenerate ACTIVE.md · no product code</text>

  <path d="M640 144 H686 V218" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="596" y="222" width="142" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="th" x="667" y="242" text-anchor="middle" dominant-baseline="central" fill="#085041">ACTIVE.md</text>
  <text class="tt" x="667" y="261" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">derived globally</text>
  <text class="tt" x="667" y="276" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">from trunk files</text>

  <line x1="380" y1="184" x2="380" y2="204" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="132" y1="204" x2="504" y2="204" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="132" y1="204" x2="132" y2="224" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="318" y1="204" x2="318" y2="224" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="504" y1="204" x2="504" y2="224" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="42" y="228" width="180" height="118" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text class="th" x="132" y="250" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Path A</text>
  <text class="ts" x="132" y="271" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own branch + worktree</text>
  <text class="tt" x="132" y="294" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one writer</text>
  <text class="tt" x="132" y="312" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own ledger + area note</text>
  <text class="tt" x="132" y="330" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ATOMIK_LANE=a</text>

  <rect x="228" y="228" width="180" height="118" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text class="th" x="318" y="250" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Path B</text>
  <text class="ts" x="318" y="271" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own branch + worktree</text>
  <text class="tt" x="318" y="294" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one writer</text>
  <text class="tt" x="318" y="312" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own ledger + area note</text>
  <text class="tt" x="318" y="330" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ATOMIK_LANE=b</text>

  <rect x="414" y="228" width="180" height="118" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
  <text class="th" x="504" y="250" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Path N</text>
  <text class="ts" x="504" y="271" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own branch + worktree</text>
  <text class="tt" x="504" y="294" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one writer</text>
  <text class="tt" x="504" y="312" text-anchor="middle" dominant-baseline="central" fill="#534AB7">own ledger + area note</text>
  <text class="tt" x="504" y="330" text-anchor="middle" dominant-baseline="central" fill="#534AB7">ATOMIK_LANE=n</text>

  <line x1="132" y1="347" x2="132" y2="374" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="318" y1="347" x2="318" y2="374" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="504" y1="347" x2="504" y2="374" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="132" y1="374" x2="504" y2="374" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="318" y1="374" x2="318" y2="395" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="94" y="399" width="448" height="94" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
  <text class="th" x="318" y="420" text-anchor="middle" dominant-baseline="central" fill="#444441">Each path merges itself</text>
  <text class="ts" x="318" y="443" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">closing ceremony · rebase on trunk · gates on rebased result</text>
  <text class="ts" x="318" y="462" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">coherence audit · status done · merge</text>
  <text class="tt" x="318" y="481" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">no integrator · merge order only is serialized</text>
  <line x1="318" y1="494" x2="318" y2="518" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="138" y="522" width="360" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text class="th" x="318" y="542" text-anchor="middle" dominant-baseline="central" fill="#085041">Trunk — integrated, globally visible state</text>
  <text class="ts" x="318" y="561" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">owner dogfoods here; new feedback opens another path</text>

  <path d="M138 549 H18 V51 H176" fill="none" stroke="#854F0B" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowAmber)"/>
  <text class="tt" x="24" y="390" fill="#854F0B">feedback</text>
  <text class="tt" x="24" y="406" fill="#854F0B">preempts</text>
</svg>
