# Cairn — the protocol made enforceable (CP-OPS-001 S04b).
#
# Two jobs, deliberately separate, because they answer two different
# questions and a team needs to see which one failed:
#
#   gates   does the software still work?
#   cairn   was the protocol followed?
#
# Both run bare: the exit code is the verdict, never a grep over output
# (bedrock 24 gate discipline — the 2026-07-16 white-screen incident
# shipped because `typecheck | grep | head` swallowed a failing status).
name: cairn

# WHEN this runs is half the enforcement. Until 2026-08-24 it ran on `push:
# master` and `pull_request` only — and every path in this repository has
# merged with a LOCAL merge commit, never a pull request (`git log --merges`:
# six "Merge CP-*", zero "Merge pull request"). So `pull_request` never fired,
# `path/*` pushes fired nothing, and the only run happened on the trunk AFTER
# the merge had already landed.
#
# The consequence: every path-scoped rule — branch→path, trunk registration,
# the rebase gate, the remote checkpoint, scope drift, the coherence audit —
# had never once executed in CI. The gate that `paths.md` calls "what makes a
# gatekeeper unnecessary" could only ever observe a merge, not prevent one
# (audit 2026-08-24, finding F8).
on:
  push:
    branches: [master, 'path/**']
  pull_request:

# Every completed checkpoint is pushed immediately, so a path
# generates many runs. Supersede rather than queue them: the newest head of a
# branch is the only one whose verdict matters.
concurrency:
  group: cairn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (typecheck · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cairn:
    name: cairn-check (protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # cairn-check compares the branch against its merge-base, so it
          # needs history rather than the default shallow clone.
          fetch-depth: 0
          # On a pull_request, the DEFAULT ref is the merge preview — a merge
          # of this branch into the base. That commit contains the base tip by
          # construction, so the rebase gate would pass on every stale branch
          # without proving anything. Check out the pull request HEAD instead,
          # so the gate judges the branch that will actually land. Empty on a
          # push event, where the default ref is already correct.
          ref: ${{ github.event.pull_request.head.sha }}
      # THE RETENTION NAMESPACE IS NOT A BRANCH.
      #
      # `actions/checkout` fetches `refs/heads/*` and `refs/tags/*`. Checkpoint
      # retention lives under `refs/cairn/*`, so a default checkout sees ZERO of
      # it — and `git for-each-ref` over an unfetched namespace exits 0 with no
      # output, which is indistinguishable from "nothing was ever retained".
      # Every CI run of every path therefore reported the refs missing while
      # they sat on the remote (CP-OPS-002 S08b). The checker now refuses to
      # call that a fact; this is what lets it judge the real one instead.
      #
      # `|| true`: a repository that has never written a retention ref has no
      # such namespace to fetch, and that is not a CI failure. The checker
      # decides what an empty namespace means — the fetch only makes sure the
      # question is asked with the evidence available.
      - name: fetch the checkpoint retention namespace
        run: git fetch origin '+refs/cairn/*:refs/cairn/*' || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The validator itself remains dependency-free. Its test job also checks
      # the generated specification reader, whose renderer is a declared
      # workspace dependency, so the complete executable contract is installed.
      - run: npm ci
      - name: validator self-test
        run: npm run cairn-check:test
      - name: protocol check
        # --base doubles as the rebase gate: cairn-check fails a path/* branch
        # that does not already contain this ref's tip. Every path merges
        # itself, so nothing else stops a stale branch landing on a trunk it
        # never saw. A protected profile must pair this with its tested
        # exact-commit transport rather than relying on a generic host switch.
        env:
          CAIRN_BASE_REF: origin/${{ github.base_ref || 'master' }}
          CAIRN_EVENT_BEFORE: ${{ github.event.before }}
          CAIRN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cairn_previous="$CAIRN_EVENT_BEFORE"
          if [[ ! "$cairn_previous" =~ ^[0-9a-f]{40}$ ]] || [[ "$cairn_previous" =~ ^0+$ ]]; then
            cairn_previous="$CAIRN_PR_BASE_SHA"
          fi
          if [[ ! "$cairn_previous" =~ ^[0-9a-f]{40}$ ]] || [[ "$cairn_previous" =~ ^0+$ ]]; then
            cairn_previous="$(git rev-parse HEAD^)"
          fi
          node tools/cairn-check.mjs --base "$CAIRN_BASE_REF" --previous "$cairn_previous"
